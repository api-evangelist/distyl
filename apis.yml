name: Distyl
description: >-
  Distyl is an applied-AI company architecting the AI-native enterprise. Rather than
  layering automation onto broken processes, Distyl reimagines enterprise operations
  from the ground up with AI at the core, partnering with Fortune 500 organizations
  across Telecom, Healthcare, Manufacturing, Insurance, Retail, and Financial Services
  to design and operationalize AI transformations and deploy production-grade agentic
  AI systems in weeks. Its product suite includes Weave, Distillery, Context Mesh,
  Context Views, Journey, Personalization, and Apprentice. Founded by operators and
  researchers from Palantir, CIA, OpenAI, Google DeepMind, Tesla, NASA, Stanford, and
  MIT, and backed by Coatue, OpenAI, Lightspeed, Microsoft, and Khosla Ventures. Distyl
  is a services/platform company with no public developer API; this profile captures
  its published web surface. Distyl is SOC 2 certified and GDPR compliant.
